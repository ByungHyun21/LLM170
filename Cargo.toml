[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/diag",
    "crates/server",
    "crates/backend-gpu",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[profile.release]

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"
approx_constant = "allow"
